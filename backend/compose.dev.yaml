# APENAS desenvolvimento local. Nunca fazer deploy deste compose em producao.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saal
      MYSQL_ROOT_PASSWORD: ${SAAL_DB_ROOT_PASSWORD:?Defina SAAL_DB_ROOT_PASSWORD no terminal}
      SAAL_DB_RUNTIME_PASSWORD: ${SAAL_DB_RUNTIME_PASSWORD:?Defina SAAL_DB_RUNTIME_PASSWORD no terminal}
      SAAL_DB_MIGRATION_PASSWORD: ${SAAL_DB_MIGRATION_PASSWORD:?Defina SAAL_DB_MIGRATION_PASSWORD no terminal}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - saal_mysql_data:/var/lib/mysql
      - ./docker/mysql/init/10-create-users.sh:/docker-entrypoint-initdb.d/10-create-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
volumes:
  saal_mysql_data:
