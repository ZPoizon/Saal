openapi: 3.0.3
info:
  title: SAAL API
  version: 0.5.0
  description: |
    Contrato do backend implementado neste worktree; não representa um deploy ativo. O escopo
    inclui catálogo, administração de animais, autenticação administrativa, manifestações de
    interesse persistidas e fotografias armazenadas no MySQL. Estados disponíveis são AVAILABLE
    e ADOPTED; o catálogo lista apenas AVAILABLE, e ADOPTED permanece consultável sem aceitar
    novas manifestações. Não há workflow de aprovação nem mensagens automáticas. A política de
    privacidade, finalidade e retenção de PII continua pendente de decisão operacional da ONG.
servers:
  - url: /api/v1
    description: Prefixo do serviço Spring Boot implementado neste worktree.
security: []
tags:
  - name: Catálogo público
    description: Catálogo público; somente animais AVAILABLE na listagem e sem informação médica.
  - name: Administração de animais
    description: Operações administrativas protegidas por sessão server-side.
  - name: Fotografias
    description: Upload administrativo e leitura pública de imagens persistidas no MySQL.
  - name: Solicitações públicas
    description: Intake público sem login, sem retorno de dados pessoais.
  - name: Gestão administrativa de solicitações
    description: Consulta administrativa somente leitura, protegida por autenticação.
  - name: Sessão administrativa
    description: Sessão server-side, CSRF e proxy same-site aprovados em ADR-006.
  - name: Contato
    description: Formulário geral fora do primeiro incremento; canais públicos são links.
x-saal-validation-policy:
  server-authoritative: true
  description: |
    Validar conteúdo, formato e limites no servidor usando DTOs allowlist. Requisição inválida
    usa 400 Problem Details sem ecoar valor enviado, credencial ou PII. O intake exige todos
    os campos e aplica limites de tamanho; o limite básico de envios é em memória por IP e
    precisa de validação operacional antes de produção.
x-saal-intentionally-omitted:
  - Upload de imagem: fronteira/endpoint omitido até decisão ONG-06; quantidade 1–3 já aprovada.
  - Paginação/ordenação: sem semântica ou limites definidos; requer decisão de volume e API.
  - Métricas públicas: não há endpoint ou fonte aprovada (ONG-11).
  - Transições de status de solicitação: não há workflow aprovado; avaliação manual pela ONG.
  - Histórico administrativo detalhado: dispensado pela ONG (ONG-08).
  - Exclusão/arquivamento de animais: fora do primeiro incremento até decisão ONG-03.
  - Formulário de contato geral: fora do primeiro incremento até decisão ONG-07.
  - Matriz de papéis administrativos: um único administrador, sem papéis diferenciados.
  - Terceiro canal de contato: não fixado porque a pergunta original não está disponível.
paths:
  /animals:
    get:
      tags: [Catálogo público]
      operationId: listPublicAnimals
      summary: Lista animais publicados e elegíveis
      description: |
        O catálogo retorna somente animais AVAILABLE; ADOPTED permanece consultável por ID,
        mas não aceita interesse. Respostas públicas não incluem informação médica nem PII.
      x-saal-status: implemented-in-worktree
      parameters:
        - in: query
          name: search
          description: Busca por nome; limites de tamanho ainda não aprovados.
          schema:
            type: string
        - in: query
          name: species
          description: Filtro opcional; valores dependem da aprovação do vocabulário de domínio.
          schema:
            type: string
      responses:
        "200":
          description: Resultado público, somente após aprovação do modelo de publicação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /animals/{animalId}:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Catálogo público]
      operationId: getPublicAnimal
      summary: Obtém detalhe público de um animal
      description: |
        Detalhe identifica o estado e não inclui informações médicas ou PII. Animal ADOPTED
        permanece consultável, mas não aceita manifestação de interesse.
      x-saal-status: implemented-in-worktree
      responses:
        "200":
          description: Projeção pública aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAnimal"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals:
    get:
      tags: [Administração de animais]
      operationId: listAdminAnimals
      summary: Lista animais para administração
      description: |
        Operação protegida por ROLE_ADMIN no servidor. A rota visual do frontend não substitui
        autenticação e autorização server-side.
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Projeção administrativa após aprovação de campos e permissões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    post:
      tags: [Administração de animais]
      operationId: createAdminAnimal
      summary: Cadastra animal
      description: Campos e regras de domínio não aprovados; validar no servidor antes de qualquer persistência.
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnimalInput"
      responses:
        "201":
          description: Animal criado após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals/{animalId}:
    description: Exclusão definitiva não é suportada até a aprovação da ONG; DELETE retorna 405.
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Administração de animais]
      operationId: getAdminAnimal
      summary: Obtém registro para administração
      description: Operação protegida por ROLE_ADMIN.
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Projeção administrativa aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    put:
      tags: [Administração de animais]
      operationId: updateAdminAnimal
      summary: Atualiza animal
      description: Campos e regras de domínio validados no servidor.
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnimalInput"
      responses:
        "200":
          description: Animal atualizado após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /animals/{animalId}/interests:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    post:
      tags: [Solicitações públicas]
      operationId: createAnimalInterest
      summary: Registra interesse em adoção
      description: |
        Registra somente para animal AVAILABLE. Todos os campos são validados no servidor;
        visitante não precisa de login. A resposta não contém PII. Animal ADOPTED ou ausente
        não gera registro. O limitador básico é por IP, em memória: cinco registros por janela
        de dez minutos e cooldown de quinze minutos. Finalidade e retenção de PII continuam
        pendentes de decisão operacional da ONG.
      x-saal-status: implemented-in-worktree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimalInterestInput"
      responses:
        "201":
          description: Confirmação mínima após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimalInterestReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/interests:
    get:
      tags: [Gestão administrativa de solicitações]
      operationId: listAdminAnimalInterests
      summary: Lista manifestações de interesse
      description: |
        Consulta somente leitura protegida por ROLE_ADMIN. Contém dados pessoais e nunca deve
        ser exposta a visitantes; finalidade e retenção seguem pendentes.
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Projeção administrativa mínima aprovada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAnimalInterest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals/{animalId}/interests:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Gestão administrativa de solicitações]
      operationId: listAdminInterestsByAnimal
      summary: Lista manifestações de um animal
      description: Consulta somente leitura protegida por ROLE_ADMIN e limitada ao animal indicado.
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Projeção administrativa das manifestações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAnimalInterest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /auth/csrf:
    get:
      tags: [Sessão administrativa]
      operationId: getAdminCsrfToken
      summary: Obtém token CSRF para a sessão do navegador
      description: Cria ou recupera token CSRF associado à sessão server-side; resposta não é cacheável.
      responses:
        "200":
          description: Token e nome do header a enviar em operações mutáveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "403":
          description: Origem do browser não permitida pela allowlist CORS.
        default:
          $ref: "#/components/responses/DefaultProblem"
  /auth/session:
    get:
      tags: [Sessão administrativa]
      operationId: getAdminSession
      summary: Consulta estado da sessão atual
      description: Retorna estado booleano sem revelar username ou dados da credencial.
      responses:
        "200":
          description: Estado de autenticação para a sessão do navegador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "403":
          description: Origem do browser não permitida pela allowlist CORS.
        default:
          $ref: "#/components/responses/DefaultProblem"
  /auth/login:
    post:
      tags: [Sessão administrativa]
      operationId: loginAdmin
      summary: Autentica o único administrador
      description: |
        Username e hash são provisionados fora do repositório. Enviar token CSRF no header
        X-CSRF-TOKEN. Sucesso cria sessão server-side e troca o identificador; credenciais
        inválidas recebem erro genérico. Dez falhas por IP em dez minutos acionam cooldown de
        quinze minutos (ADR-006).
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "204":
          description: Credenciais aceitas; sessão estabelecida no servidor.
          headers:
            Set-Cookie:
              description: Cookie de sessão HttpOnly; Secure por padrão e SameSite=Lax.
              schema:
                type: string
        "401":
          description: Credenciais inválidas; resposta genérica sem enumeração.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginFailure"
        "403":
          description: Token CSRF ausente ou inválido.
        "429":
          description: Limite de tentativas atingido; aguardar cooldown.
          headers:
            Retry-After:
              description: Segundos até nova tentativa.
              schema:
                type: integer
                example: 900
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /auth/logout:
    post:
      tags: [Sessão administrativa]
      operationId: logoutAdmin
      summary: Invalida sessão administrativa
      description: Exige token CSRF; invalida a HttpSession no servidor e remove o cookie do navegador.
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      responses:
        "204":
          description: Sessão invalidada pelo servidor.
          headers:
            Set-Cookie:
              description: Expira o cookie de sessão no navegador.
              schema:
                type: string
        "403":
          description: Token CSRF ausente ou inválido.
        default:
          $ref: "#/components/responses/DefaultProblem"
  /contact-messages:
    post:
      tags: [Contato]
      operationId: submitContactMessage
      summary: Envia mensagem de contato
      description: |
        Fora do primeiro incremento. Os canais públicos aprovados são WhatsApp e telefone,
        com um terceiro canal ainda não definido; eles são links, não este endpoint. Destino,
        campos, finalidade/retenção e política antiabuso do formulário geral continuam
        pendentes (ONG-05/ONG-07/ONG-09). Não coletar nem confirmar mensagem com este rascunho.
      x-saal-status: deferred
      x-saal-blocked-by: [ONG-05, ONG-07, ONG-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "202":
          description: Aceite pelo destino efetivo, não significa lida ou respondida
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/photos:
    post:
      tags: [Fotografias]
      operationId: uploadAnimalPhotos
      summary: Envia fotografias para armazenamento
      description: |
        Recebe 1–3 arquivos no campo multipart `photos` em uma mesma requisição. Exige sessão
        administrativa e CSRF. A API valida os magic bytes (JPEG, PNG ou WebP) e o limite de
        5 MB por arquivo, persiste o binário em `stored_photo` e devolve uma URL pública
        imutável por arquivo, na mesma ordem. O cliente normaliza a imagem antes do envio.
        Formato, retenção e moderação definitivos continuam pendentes (ONG-06, ADR-007).
      x-saal-status: implemented-in-worktree
      x-saal-auth-required: true
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Fotografias persistidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: Formato não suportado; aceitos JPEG, PNG e WebP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/PhotoId"
    get:
      tags: [Fotografias]
      operationId: getPhoto
      summary: Lê fotografia publicada
      description: |
        Leitura pública do binário persistido. O identificador é imutável; a resposta pode ser
        cacheada. Parâmetros de imagem na URL (por exemplo `w`, `h`, `fit`) são ignorados pela
        API. Responde 404 para identificador inexistente ou inválido.
      x-saal-status: implemented-in-worktree
      security: []
      responses:
        "200":
          description: Conteúdo binário da fotografia.
          headers:
            Cache-Control:
              description: Cache público e imutável por um ano.
              schema:
                type: string
            X-Content-Type-Options:
              description: Sempre `nosniff`.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultProblem"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Cookie opaco HttpOnly de sessão server-side; não é token bearer.
  parameters:
    AnimalId:
      in: path
      name: animalId
      required: true
      schema:
        type: string
        minLength: 1
    CsrfTokenHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      description: Token emitido por GET /auth/csrf para a sessão atual.
      schema:
        type: string
    PhotoId:
      in: path
      name: photoId
      required: true
      description: Identificador numérico imutável devolvido pelo upload.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Requisição inválida; não ecoar valores sensíveis da entrada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Credencial ausente ou inválida; mensagem genérica sem enumeração.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Identidade autenticada sem autorização para a operação/recurso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Recurso não encontrado; não revelar recurso protegido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Conflito de estado/concorrência; sem regra de transição presumida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: Payload excede limite configurado, ainda pendente de decisão operacional.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Requisição limitada por controle antiabuso; sem detalhe que facilite abuso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServerError:
      description: Erro interno genérico; sem stack trace, SQL, credenciais ou PII.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    DefaultProblem:
      description: Outro erro HTTP com formato Problem Details, sem detalhe interno.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    AnimalStatus:
      type: string
      enum: [AVAILABLE, ADOPTED]
      description: |
        Estados aprovados pela ONG em 2026-10-29: AVAILABLE (“Disponível para adoção”) e
        ADOPTED (“Adotado”). Animais adotados permanecem cadastrados e identificados.
    AnimalPhoto:
      type: string
      description: |
        URL relativa de fotografia persistida (`/api/v1/photos/{id}`) ou referência externa
        legada. Quantidade aprovada: 1–3 por animal. A API devolve uma URL imutável por upload;
        a política definitiva de formato, retenção e moderação continua pendente (ONG-06).
    PhotoUploadResponse:
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 3
          description: Uma URL persistente por arquivo, na ordem enviada.
          items:
            type: string
            pattern: "^/api/v1/photos/[1-9][0-9]*$"
    PublicAnimal:
      type: object
      additionalProperties: false
      description: |
        Projeção pública implementada. Informações médicas e PII não são retornadas.
      required: [id, name, species, age, size, sex, status, description, personality, photos]
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
          enum: [dog, cat]
        age:
          type: string
        size:
          type: string
          enum: [pequeno, médio, grande]
        sex:
          type: string
          enum: [macho, fêmea]
        status:
          $ref: "#/components/schemas/AnimalStatus"
        description:
          type: string
        personality:
          type: array
          items:
            type: string
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnimalPhoto"
    AdminAnimal:
      type: object
      additionalProperties: false
      description: |
        Projeção administrativa autenticada; pode incluir informação médica, nunca retornada
        pela projeção pública.
      required: [id, name, species, age, size, sex, status, description, personality, medicalInfo, photos]
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
          enum: [dog, cat]
        age:
          type: string
        size:
          type: string
          enum: [pequeno, médio, grande]
        sex:
          type: string
          enum: [macho, fêmea]
        status:
          $ref: "#/components/schemas/AnimalStatus"
        description:
          type: string
        personality:
          type: array
          items:
            type: string
        medicalInfo:
          type: string
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnimalPhoto"
    AdminAnimalInput:
      type: object
      additionalProperties: false
      description: |
        Entrada administrativa validada pelo backend.
      required: [name, species, age, size, sex, status, description, photos]
      properties:
        name:
          type: string
          maxLength: 120
        species:
          type: string
          enum: [dog, cat]
        age:
          type: string
          maxLength: 40
        size:
          type: string
          enum: [pequeno, médio, grande]
        sex:
          type: string
          enum: [macho, fêmea]
        status:
          $ref: "#/components/schemas/AnimalStatus"
        description:
          type: string
          maxLength: 2000
        personality:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 60
        medicalInfo:
          type: string
          maxLength: 1000
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnimalPhoto"
    AnimalInterestInput:
      type: object
      additionalProperties: false
      description: |
        Campos obrigatórios de interesse. O animal é referenciado pelo caminho.
      required: [fullName, whatsapp, city, email]
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 120
        whatsapp:
          type: string
          maxLength: 32
          pattern: '^\s*\+?[0-9\s().-]+\s*$'
        city:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 160
    AnimalInterestReceipt:
      type: object
      additionalProperties: false
      description: |
        Confirmação mínima; não inclui dados pessoais e não significa aprovação da adoção.
      required: [received, createdAt]
      properties:
        received:
          type: boolean
          enum: [true]
        createdAt:
          type: string
          nullable: true
    AdminAnimalInterest:
      type: object
      additionalProperties: false
      description: |
        Projeção administrativa somente leitura contendo PII; protegida por ROLE_ADMIN.
      required: [id, animalId, animalName, fullName, whatsapp, city, email, createdAt]
      properties:
        id:
          type: string
        animalId:
          type: string
        animalName:
          type: string
        fullName:
          type: string
        whatsapp:
          type: string
        city:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
    AdminLoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
    AdminLoginFailure:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Mensagem genérica que não identifica username ou senha inválidos.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          enum: [X-CSRF-TOKEN]
    AdminSessionStatus:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    ContactMessageInput:
      type: object
      additionalProperties: false
      description: |
        Fora do primeiro incremento. Campos PII e destino do formulário de contato geral
        dependem de ONG-05/ONG-07/ONG-09. Os canais públicos de WhatsApp e telefone são links.
    ProblemDetails:
      type: object
      description: |
        Formato base RFC 9457. Extensão errors contém somente códigos e ponteiros de campo;
        nunca incluir valores enviados, credenciais, stack trace, SQL ou PII.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica a classe do problema.
        title:
          type: string
          description: Resumo seguro e estável para a classe do problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Status HTTP da resposta.
        detail:
          type: string
          description: Explicação segura, sem detalhe interno ou valores pessoais.
        instance:
          type: string
          format: uri-reference
          description: Identificador não sensível desta ocorrência.
        errors:
          type: array
          description: Extensão local opcional com erros por campo sem refletir valores enviados.
          items:
            type: object
            additionalProperties: false
            required: [pointer, code]
            properties:
              pointer:
                type: string
                description: JSON Pointer do campo inválido.
              code:
                type: string
                description: Código estável de validação, sem conteúdo do campo.
