openapi: 3.0.3
info:
  title: SAAL API planejada
  version: 0.2.0-draft
  description: |
    RASCUNHO NÃO NORMATIVO. Nenhum endpoint está implementado. Operações candidatas marcadas
    x-saal-status: blocked não podem ser implementadas até os gates indicados serem resolvidos.
    Campos de domínio, enums, PII, limites e estados foram omitidos quando ainda dependem da
    ONG. Não há security scheme porque sessão é apenas a preferência e a topologia ainda não
    foi aprovada. Respostas de erro usam Problem Details (RFC 9457); não refletem runtime ativo.
tags:
  - name: Catálogo público
    description: Operações públicas candidatas; publicação/elegibilidade dependem de ONG-02.
  - name: Administração de animais
    description: Operações admin bloqueadas por decisões de conta, domínio e visibilidade.
  - name: Solicitações públicas
    description: Recebimento bloqueado por decisões de dados, processo e abuso.
  - name: Gestão administrativa de solicitações
    description: Operações administrativas bloqueadas por ONG-01/04/05/08.
  - name: Sessão administrativa
    description: Rascunho bloqueado; protocolo/topologia não decididos.
  - name: Contato
    description: Operação bloqueada até destino e tratamento aprovados.
x-saal-validation-policy:
  server-authoritative: true
  description: |
    Validar conteúdo, formato e limites no servidor usando DTOs allowlist depois da aprovação
    do modelo. Requisição inválida usa 400 Problem Details e pode conter somente ponteiro e
    código estável do campo; nunca ecoar valor enviado, credencial ou PII. Limites numéricos,
    required fields e valores de domínio permanecem bloqueados pelas decisões listadas em cada
    operação. Respostas 413/429 são previstas sem fixar quota ou tamanho.
x-saal-intentionally-omitted:
  - Upload de imagem: fronteira/endpoint omitido até decisão ONG-06.
  - Paginação/ordenação: sem semântica ou limites definidos; requer decisão de volume e API.
  - Métricas públicas: não há endpoint ou fonte aprovada (ONG-11).
paths:
  /animals:
    get:
      tags: [Catálogo público]
      operationId: listPublicAnimals
      summary: Lista animais publicados e elegíveis
      description: |
        Candidato bloqueado até ONG-02/ONG-10 aprovarem publicação, elegibilidade e campos.
        O servidor deve retornar somente a projeção pública aprovada; filtros/enums do mock
        não são contrato. Erros de validação não devem refletir valores PII nem internos.
        Paginação/ordenação não estão especificadas até decisão técnica de volume.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-02, ONG-10]
      parameters:
        - in: query
          name: search
          description: Busca por nome; limites de tamanho ainda não aprovados.
          schema:
            type: string
        - in: query
          name: species
          description: Filtro opcional; valores dependem da aprovação do vocabulário de domínio.
          schema:
            type: string
      responses:
        "200":
          description: Resultado público, somente após aprovação do modelo de publicação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /animals/{animalId}:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Catálogo público]
      operationId: getPublicAnimal
      summary: Obtém detalhe público de um animal
      description: |
        Candidato bloqueado até ONG-02/ONG-10 aprovarem elegibilidade, publicação e campos.
        Nunca retornar campos administrativos, PII ou informação médica não aprovada.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-02, ONG-10]
      responses:
        "200":
          description: Projeção pública aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAnimal"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals:
    get:
      tags: [Administração de animais]
      operationId: listAdminAnimals
      summary: Lista animais para administração
      description: |
        Operação protegida no servidor, bloqueada até as decisões de conta, papel, domínio,
        campos e visibilidade. Não confiar em rota protegida apenas no cliente.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "200":
          description: Projeção administrativa após aprovação de campos e permissões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    post:
      tags: [Administração de animais]
      operationId: createAdminAnimal
      summary: Cadastra animal
      description: Campos e regras de domínio não aprovados; validar no servidor antes de qualquer persistência.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10]
      x-saal-auth-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnimalInput"
      responses:
        "201":
          description: Animal criado após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals/{animalId}:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Administração de animais]
      operationId: getAdminAnimal
      summary: Obtém registro para administração
      description: Operação protegida, bloqueada até ONG-01/ONG-02/ONG-10 e auth/topologia aprovadas.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "200":
          description: Projeção administrativa aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    put:
      tags: [Administração de animais]
      operationId: updateAdminAnimal
      summary: Atualiza animal
      description: Campos e regras de domínio não aprovados; validar no servidor antes de qualquer persistência.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10]
      x-saal-auth-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnimalInput"
      responses:
        "200":
          description: Animal atualizado após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    delete:
      tags: [Administração de animais]
      operationId: deleteOrArchiveAdminAnimal
      summary: Executa operação de ciclo de vida do animal
      description: ONG-03 não decidiu entre archive/delete; nenhum comportamento pode ser implementado com base neste rascunho.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-01, ONG-03]
      x-saal-auth-required: true
      responses:
        "204":
          description: Resposta candidata somente após definir operação e persistência
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /adoption-requests:
    post:
      tags: [Solicitações públicas]
      operationId: createAdoptionRequest
      summary: Registra interesse em adoção
      description: |
        Bloqueado até aprovação de elegibilidade/processo, campos/finalidade/retention e
        antiabuso. Não receber, armazenar ou ecoar PII a partir deste schema vazio.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-02, ONG-04, ONG-05, ONG-09, ONG-10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRequestInput"
      responses:
        "201":
          description: Confirmação candidata somente após persistência aprovada e real
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/adoption-requests:
    get:
      tags: [Gestão administrativa de solicitações]
      operationId: listAdminAdoptionRequests
      summary: Lista solicitações para administração
      description: |
        Operação protegida no servidor. Campos retornados e filtros dependem de aprovação
        ONG-01/04/05/08; não expor PII a visitantes.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-04, ONG-05, ONG-08, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "200":
          description: Projeção administrativa mínima aprovada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAdoptionRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/adoption-requests/{requestId}/status:
    patch:
      tags: [Gestão administrativa de solicitações]
      operationId: updateAdminAdoptionRequestStatus
      summary: Atualiza o status de uma solicitação
      description: Estados e transições ainda não foram aprovados; não implementar enum do mock.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-01, ONG-04, ONG-08, TEC-04, TEC-05]
      x-saal-auth-required: true
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionStatusUpdate"
      responses:
        "200":
          description: Estado aprovado e persistido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdoptionRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/session:
    post:
      tags: [Sessão administrativa]
      operationId: createAdminSession
      summary: Solicita autenticação administrativa
      description: |
        Rascunho bloqueado. Credenciais, sessão/cookie, CSRF, respostas e origem dependem de
        TEC-04/05 e ONG-01. Não há security scheme aprovado.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-09, TEC-04, TEC-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionInput"
      responses:
        "200":
          description: Sessão estabelecida pelo mecanismo ainda não decidido
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    delete:
      tags: [Sessão administrativa]
      operationId: deleteAdminSession
      summary: Encerra sessão administrativa
      description: Logout deve invalidar credencial no servidor; protocolo/topologia pendentes.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "204":
          description: Sessão invalidada pelo servidor
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /contact-messages:
    post:
      tags: [Contato]
      operationId: submitContactMessage
      summary: Envia mensagem de contato
      description: |
        Bloqueado. Destino, campos, finalidade/retention e política antiabuso ainda não foram
        aprovados; não coletar nem confirmar mensagem com este rascunho.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-05, ONG-07, ONG-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "202":
          description: Aceite pelo destino efetivo, não significa lida ou respondida
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
components:
  parameters:
    AnimalId:
      in: path
      name: animalId
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Requisição inválida; não ecoar valores sensíveis da entrada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Credencial ausente ou inválida; mensagem genérica sem enumeração.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Identidade autenticada sem autorização para a operação/recurso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Recurso não encontrado; não revelar recurso protegido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Conflito de estado/concorrência; sem regra de transição presumida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: Payload excede limite configurado, ainda pendente de decisão operacional.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Requisição limitada por controle antiabuso a definir; sem detalhe que facilite abuso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServerError:
      description: Erro interno genérico; sem stack trace, SQL, credenciais ou PII.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    DefaultProblem:
      description: Outro erro HTTP com formato Problem Details, sem detalhe interno.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    PublicAnimal:
      type: object
      additionalProperties: false
      description: |
        Projeção sem propriedades de propósito: ONG-02/ONG-10 ainda não aprovaram campos
        nem visibilidade. Não é um DTO implementável.
    AdminAnimal:
      type: object
      additionalProperties: false
      description: |
        Projeção sem propriedades de propósito: ONG-01/ONG-02/ONG-10 ainda não aprovaram
        permissões, campos ou visibilidade. Não é um DTO implementável.
    AdminAnimalInput:
      type: object
      additionalProperties: false
      description: Campos/validações bloqueados; não aceitar payload de negócio até aprovação.
    AdoptionRequestInput:
      type: object
      additionalProperties: false
      description: |
        Schema intencionalmente vazio. Campos PII, finalidade e validação estão bloqueados
        por ONG-04/ONG-05/ONG-09/ONG-10.
    AdoptionReceipt:
      type: object
      additionalProperties: false
      description: Recibo sem campos definido; resposta de sucesso só após persistência real aprovada.
    AdminAdoptionRequest:
      type: object
      additionalProperties: false
      description: |
        Schema intencionalmente vazio; nenhum PII pode ser exposto até aprovação de campos,
        finalidade e permissões. Não é um DTO implementável.
    AdoptionStatusUpdate:
      type: object
      additionalProperties: false
      description: Status e transições do mock não são aprovados; schema sem propriedades.
    AdminSessionInput:
      type: object
      additionalProperties: false
      description: Credenciais/identificador e formato de sessão dependem de TEC-04/05 e ONG-01.
    ContactMessageInput:
      type: object
      additionalProperties: false
      description: Campos PII e destino de contato dependem de ONG-05/ONG-07/ONG-09.
    ProblemDetails:
      type: object
      description: |
        Formato base RFC 9457. Extensão errors contém somente códigos e ponteiros de campo;
        nunca incluir valores enviados, credenciais, stack trace, SQL ou PII.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica a classe do problema.
        title:
          type: string
          description: Resumo seguro e estável para a classe do problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Status HTTP da resposta.
        detail:
          type: string
          description: Explicação segura, sem detalhe interno ou valores pessoais.
        instance:
          type: string
          format: uri-reference
          description: Identificador não sensível desta ocorrência.
        errors:
          type: array
          description: Extensão local opcional com erros por campo sem refletir valores enviados.
          items:
            type: object
            additionalProperties: false
            required: [pointer, code]
            properties:
              pointer:
                type: string
                description: JSON Pointer do campo inválido.
              code:
                type: string
                description: Código estável de validação, sem conteúdo do campo.
