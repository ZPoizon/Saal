openapi: 3.0.3
info:
  title: SAAL API planejada
  version: 0.2.0-draft
  description: |
    RASCUNHO NÃO NORMATIVO. Nenhum endpoint está implementado. Operações candidatas marcadas
    x-saal-status: blocked ou deferred não podem ser implementadas até os gates indicados serem
    resolvidos. O escopo de negócio aprovado em 2026-10-29 é catálogo de animais + manifestação
    de interesse, com avaliação manual pela ONG. Estados aprovados: AVAILABLE e ADOPTED; cada
    animal tem 1–3 fotos; o intake coleta nome, WhatsApp, cidade e e-mail. Não há workflow de
    status de solicitação nem histórico administrativo detalhado. Campos de domínio, PII,
    limites e o terceiro canal de contato permanecem omitidos quando dependem da ONG. Não há
    security scheme porque sessão é apenas a preferência e a topologia ainda não foi aprovada.
    Respostas de erro usam Problem Details (RFC 9457); não refletem runtime ativo.
tags:
  - name: Catálogo público
    description: Operações públicas candidatas; estados AVAILABLE/ADOPTED aprovados, demais campos pendentes.
  - name: Administração de animais
    description: Operações admin bloqueadas por identidade, campos e visibilidade pendentes.
  - name: Solicitações públicas
    description: Intake com campos aprovados; privacidade, retenção e antiabuso pendentes.
  - name: Gestão administrativa de solicitações
    description: Consulta somente leitura; sem transições de status ou histórico detalhado.
  - name: Sessão administrativa
    description: Rascunho bloqueado; um único administrador, protocolo/topologia não decididos.
  - name: Contato
    description: Formulário geral fora do primeiro incremento; canais públicos são links.
x-saal-validation-policy:
  server-authoritative: true
  description: |
    Validar conteúdo, formato e limites no servidor usando DTOs allowlist depois da aprovação
    do modelo. Requisição inválida usa 400 Problem Details e pode conter somente ponteiro e
    código estável do campo; nunca ecoar valor enviado, credencial ou PII. Limites numéricos,
    required fields e valores de domínio permanecem bloqueados pelas decisões listadas em cada
    operação. Respostas 413/429 são previstas sem fixar quota ou tamanho.
x-saal-intentionally-omitted:
  - Upload de imagem: fronteira/endpoint omitido até decisão ONG-06; quantidade 1–3 já aprovada.
  - Paginação/ordenação: sem semântica ou limites definidos; requer decisão de volume e API.
  - Métricas públicas: não há endpoint ou fonte aprovada (ONG-11).
  - Transições de status de solicitação: não há workflow aprovado; avaliação manual pela ONG.
  - Histórico administrativo detalhado: dispensado pela ONG (ONG-08).
  - Exclusão/arquivamento de animais: fora do primeiro incremento até decisão ONG-03.
  - Formulário de contato geral: fora do primeiro incremento até decisão ONG-07.
  - Matriz de papéis administrativos: um único administrador, sem papéis diferenciados.
  - Terceiro canal de contato: não fixado porque a pergunta original não está disponível.
paths:
  /animals:
    get:
      tags: [Catálogo público]
      operationId: listPublicAnimals
      summary: Lista animais publicados e elegíveis
      description: |
        O catálogo deve retornar somente animais com estado AVAILABLE. Os estados aprovados
        são AVAILABLE e ADOPTED; animais adotados permanecem cadastrados, mas não são
        oferecidos para manifestação de interesse. Campos públicos além do estado e da
        quantidade de fotos continuam bloqueados por ONG-10. Erros de validação não devem
        refletir valores PII nem internos. Paginação/ordenação não estão especificadas até
        decisão técnica de volume.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-02, ONG-10]
      parameters:
        - in: query
          name: search
          description: Busca por nome; limites de tamanho ainda não aprovados.
          schema:
            type: string
        - in: query
          name: species
          description: Filtro opcional; valores dependem da aprovação do vocabulário de domínio.
          schema:
            type: string
      responses:
        "200":
          description: Resultado público, somente após aprovação do modelo de publicação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /animals/{animalId}:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Catálogo público]
      operationId: getPublicAnimal
      summary: Obtém detalhe público de um animal
      description: |
        Detalhe deve identificar o estado aprovado. Para ADOPTED, não oferecer manifestação de
        interesse. Campos públicos além do estado e da quantidade de fotos continuam pendentes
        por ONG-10; nunca retornar campos administrativos, PII ou informação médica não
        aprovada. Visibilidade pública de animais adotados permanece pendente por ONG-02.
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-02, ONG-10]
      responses:
        "200":
          description: Projeção pública aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAnimal"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals:
    get:
      tags: [Administração de animais]
      operationId: listAdminAnimals
      summary: Lista animais para administração
      description: |
        Operação protegida no servidor, bloqueada até as decisões de identidade/sessão,
        campos e visibilidade. Há um único administrador e não há matriz de papéis; a
        autorização server-side continua obrigatória. Não confiar em rota protegida apenas no
        cliente.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "200":
          description: Projeção administrativa após aprovação de campos e permissões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    post:
      tags: [Administração de animais]
      operationId: createAdminAnimal
      summary: Cadastra animal
      description: Campos e regras de domínio não aprovados; validar no servidor antes de qualquer persistência.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10]
      x-saal-auth-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnimalInput"
      responses:
        "201":
          description: Animal criado após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/animals/{animalId}:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags: [Administração de animais]
      operationId: getAdminAnimal
      summary: Obtém registro para administração
      description: Operação protegida, bloqueada até ONG-01/ONG-02/ONG-10 e auth/topologia aprovadas.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "200":
          description: Projeção administrativa aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    put:
      tags: [Administração de animais]
      operationId: updateAdminAnimal
      summary: Atualiza animal
      description: Campos e regras de domínio não aprovados; validar no servidor antes de qualquer persistência.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-02, ONG-10]
      x-saal-auth-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnimalInput"
      responses:
        "200":
          description: Animal atualizado após persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnimal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    delete:
      tags: [Administração de animais]
      operationId: deleteOrArchiveAdminAnimal
      summary: Executa operação de ciclo de vida do animal
      description: |
        Fora do primeiro incremento. Animais adotados permanecem cadastrados; exclusão e
        arquivamento de animais não adotados continuam pendentes (ONG-03). Nenhum
        comportamento destrutivo pode ser implementado com base neste rascunho.
      x-saal-status: deferred
      x-saal-blocked-by: [ONG-01, ONG-03]
      x-saal-auth-required: true
      responses:
        "204":
          description: Resposta candidata somente após definir operação e persistência
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /adoption-requests:
    post:
      tags: [Solicitações públicas]
      operationId: createAdoptionRequest
      summary: Registra interesse em adoção
      description: |
        Registra uma manifestação de interesse para animal AVAILABLE. Campos aprovados:
        animalId, nome, WhatsApp, cidade e e-mail. Não há workflow de status nem campo de
        mensagem aprovado. O registro não implica aprovação da adoção: a ONG contata pelo
        WhatsApp e avalia manualmente. A operação continua bloqueada até decisões de
        finalidade/retenção/acesso (ONG-05) e antiabuso (ONG-09).
      x-saal-status: blocked-by-business-approval
      x-saal-blocked-by: [ONG-05, ONG-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRequestInput"
      responses:
        "201":
          description: Confirmação candidata somente após persistência aprovada e real
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/adoption-requests:
    get:
      tags: [Gestão administrativa de solicitações]
      operationId: listAdminAdoptionRequests
      summary: Lista solicitações para administração
      description: |
        Consulta somente leitura das manifestações recebidas. Não há transições de status,
        workflow de aprovação nem histórico administrativo detalhado. Campos aprovados:
        nome, WhatsApp, cidade, e-mail e referência ao animal; finalidade, retenção, acesso e
        autorização continuam pendentes (ONG-01/ONG-05). Não expor PII a visitantes.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-05, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "200":
          description: Projeção administrativa mínima aprovada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAdoptionRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /admin/session:
    post:
      tags: [Sessão administrativa]
      operationId: createAdminSession
      summary: Solicita autenticação administrativa
      description: |
        Rascunho bloqueado. Há um único administrador, sem papéis diferenciados; identidade,
        provisionamento, credenciais, sessão/cookie, CSRF, respostas e origem dependem de
        TEC-04/05 e ONG-01. Não há security scheme aprovado.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, ONG-09, TEC-04, TEC-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionInput"
      responses:
        "200":
          description: Sessão estabelecida pelo mecanismo ainda não decidido
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
    delete:
      tags: [Sessão administrativa]
      operationId: deleteAdminSession
      summary: Encerra sessão administrativa
      description: Logout deve invalidar credencial no servidor; protocolo/topologia pendentes.
      x-saal-status: blocked-by-approval
      x-saal-blocked-by: [ONG-01, TEC-04, TEC-05]
      x-saal-auth-required: true
      responses:
        "204":
          description: Sessão invalidada pelo servidor
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /contact-messages:
    post:
      tags: [Contato]
      operationId: submitContactMessage
      summary: Envia mensagem de contato
      description: |
        Fora do primeiro incremento. Os canais públicos aprovados são WhatsApp e telefone,
        com um terceiro canal ainda não definido; eles são links, não este endpoint. Destino,
        campos, finalidade/retenção e política antiabuso do formulário geral continuam
        pendentes (ONG-05/ONG-07/ONG-09). Não coletar nem confirmar mensagem com este rascunho.
      x-saal-status: deferred
      x-saal-blocked-by: [ONG-05, ONG-07, ONG-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "202":
          description: Aceite pelo destino efetivo, não significa lida ou respondida
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/DefaultProblem"
components:
  parameters:
    AnimalId:
      in: path
      name: animalId
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Requisição inválida; não ecoar valores sensíveis da entrada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Credencial ausente ou inválida; mensagem genérica sem enumeração.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Identidade autenticada sem autorização para a operação/recurso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Recurso não encontrado; não revelar recurso protegido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Conflito de estado/concorrência; sem regra de transição presumida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: Payload excede limite configurado, ainda pendente de decisão operacional.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Requisição limitada por controle antiabuso a definir; sem detalhe que facilite abuso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServerError:
      description: Erro interno genérico; sem stack trace, SQL, credenciais ou PII.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    DefaultProblem:
      description: Outro erro HTTP com formato Problem Details, sem detalhe interno.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    AnimalStatus:
      type: string
      enum: [AVAILABLE, ADOPTED]
      description: |
        Estados aprovados pela ONG em 2026-10-29: AVAILABLE (“Disponível para adoção”) e
        ADOPTED (“Adotado”). Animais adotados permanecem cadastrados e identificados.
    AnimalPhoto:
      type: string
      description: |
        Referência de fotografia. Quantidade aprovada: 1–3 por animal. Formato, tamanho,
        storage, URL publicável, EXIF e retenção continuam pendentes (ONG-06).
    PublicAnimal:
      type: object
      additionalProperties: false
      description: |
        Projeção pública parcial. Somente status e fotos têm decisão aprovada; os demais
        campos públicos continuam pendentes por ONG-10. Não é um DTO implementável completo.
      required: [status, photos]
      properties:
        status:
          $ref: "#/components/schemas/AnimalStatus"
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnimalPhoto"
    AdminAnimal:
      type: object
      additionalProperties: false
      description: |
        Projeção administrativa parcial. Status e fotos estão aprovados; demais campos,
        identidade/sessão e visibilidade continuam pendentes (ONG-01/ONG-02/ONG-10).
      required: [status, photos]
      properties:
        status:
          $ref: "#/components/schemas/AnimalStatus"
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnimalPhoto"
    AdminAnimalInput:
      type: object
      additionalProperties: false
      description: |
        Entrada administrativa parcial. Somente status e fotos têm decisão aprovada; campos
        de domínio, validações e limites continuam pendentes por ONG-10. Não aceitar payload
        de negócio até a aprovação restante.
      required: [status, photos]
      properties:
        status:
          $ref: "#/components/schemas/AnimalStatus"
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnimalPhoto"
    AdoptionRequestInput:
      type: object
      additionalProperties: false
      description: |
        Campos aprovados para coleta: animalId, nome, WhatsApp, cidade e e-mail. O campo de
        mensagem do protótipo não foi aprovado. Obrigatoriedade individual, finalidade,
        aviso, limites, retenção e acesso continuam pendentes (ONG-05/ONG-09).
      properties:
        animalId:
          type: string
          minLength: 1
          description: Referência ao animal; formato/FK pendente.
        name:
          type: string
          description: Nome do interessado; limite pendente.
        whatsapp:
          type: string
          description: WhatsApp do interessado; formato/limite pendentes.
        city:
          type: string
          description: Cidade do interessado; limite pendente.
        email:
          type: string
          format: email
          description: E-mail do interessado; limite pendente.
    AdoptionReceipt:
      type: object
      additionalProperties: false
      description: |
        Confirmação após persistência real. Campos do recibo continuam pendentes; não usar
        este schema para prometer aprovação da adoção.
    AdminAdoptionRequest:
      type: object
      additionalProperties: false
      description: |
        Consulta administrativa somente leitura. Campos aprovados para coleta: nome,
        WhatsApp, cidade, e-mail e referência ao animal. Não há status, workflow de aprovação
        nem histórico detalhado. Finalidade, retenção, acesso e autorização continuam
        pendentes (ONG-01/ONG-05).
      properties:
        id:
          type: string
          minLength: 1
          description: Identificador técnico da manifestação; formato pendente.
        animalId:
          type: string
          minLength: 1
          description: Referência ao animal; formato/FK pendente.
        name:
          type: string
          description: Nome do interessado.
        whatsapp:
          type: string
          description: WhatsApp do interessado.
        city:
          type: string
          description: Cidade do interessado.
        email:
          type: string
          format: email
          description: E-mail do interessado.
    AdminSessionInput:
      type: object
      additionalProperties: false
      description: |
        Credenciais/identificador e formato de sessão dependem de TEC-04/05 e ONG-01. Há um
        único administrador; não há papéis diferenciados.
    ContactMessageInput:
      type: object
      additionalProperties: false
      description: |
        Fora do primeiro incremento. Campos PII e destino do formulário de contato geral
        dependem de ONG-05/ONG-07/ONG-09. Os canais públicos de WhatsApp e telefone são links.
    ProblemDetails:
      type: object
      description: |
        Formato base RFC 9457. Extensão errors contém somente códigos e ponteiros de campo;
        nunca incluir valores enviados, credenciais, stack trace, SQL ou PII.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica a classe do problema.
        title:
          type: string
          description: Resumo seguro e estável para a classe do problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Status HTTP da resposta.
        detail:
          type: string
          description: Explicação segura, sem detalhe interno ou valores pessoais.
        instance:
          type: string
          format: uri-reference
          description: Identificador não sensível desta ocorrência.
        errors:
          type: array
          description: Extensão local opcional com erros por campo sem refletir valores enviados.
          items:
            type: object
            additionalProperties: false
            required: [pointer, code]
            properties:
              pointer:
                type: string
                description: JSON Pointer do campo inválido.
              code:
                type: string
                description: Código estável de validação, sem conteúdo do campo.
