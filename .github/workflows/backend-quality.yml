name: SAAL backend checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API build and tests (Java 21 + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven Wrapper
        run: chmod +x mvnw
      - name: Docker ready for Testcontainers
        run: docker info --format '{{.ServerVersion}}'
      - name: Unit and real-MySQL integration tests
        run: ./mvnw -B -ntp -Pdb-integration verify
