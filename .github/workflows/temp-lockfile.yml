name: Refresh Supabase lockfile (temporary)
on:
  push:
    branches:
      - fix/vercel-supabase-deploy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.34.3
          run_install: false
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile to this branch
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync pnpm lockfile for Supabase'
            git push origin HEAD:fix/vercel-supabase-deploy
          fi
